[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-policy-lab"
version = "0.1.0"
description = "From-scratch action-chunking policies for embodied imitation learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.10",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "torch>=2.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
sim = [
  "mani_skill==3.0.1",
]

[tool.setuptools.packages.find]
include = ["embodied_policy*"]

[tool.ruff]
line-length = 100
target-version = "py310"
