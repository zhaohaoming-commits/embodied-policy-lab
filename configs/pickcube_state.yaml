seed: 7
output_dir: outputs/pickcube_state

data:
  kind: maniskill_hdf5
  path: data/maniskill/demos/PickCube-v1/motionplanning/trajectory.state.pd_joint_pos.physx_cpu.h5
  env_id: PickCube-v1
  obs_mode: state
  control_mode: pd_joint_pos
  sim_backend: physx_cpu
  train_episodes: 80
  val_episodes: 20
  obs_horizon: 2
  action_horizon: 8

model:
  type: action_chunking_transformer
  d_model: 128
  nhead: 8
  num_layers: 3
  dim_feedforward: 512
  dropout: 0.1

train:
  epochs: 20
  batch_size: 128
  learning_rate: 0.0003
  weight_decay: 0.0001
  num_workers: 0
  amp: true

eval:
  episodes: 20
  max_steps: 50
  replan_interval: 1
